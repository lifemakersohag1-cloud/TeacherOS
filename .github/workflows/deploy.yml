name: Deploy TeacherOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original TeacherOS V4
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 7f115f88b385f3457e25f976d2dd8cd3d786cb1b
          git checkout 7f115f88b385f3457e25f976d2dd8cd3d786cb1b -- .teacheros_zip_parts
          cat .teacheros_zip_parts/* > /tmp/TeacherOS_V4.zip.b64
          base64 -d /tmp/TeacherOS_V4.zip.b64 > /tmp/TeacherOS_V4.zip
          rm -rf /tmp/TeacherOS_V4
          unzip -q /tmp/TeacherOS_V4.zip -d /tmp
          cp -R /tmp/TeacherOS_V4/. .
          rm -rf .teacheros_zip_parts
          rm -f TeacherOS_V4.zip
      - name: Configure Supabase
        shell: bash
        run: |
          cat > config.js <<'EOF'
          window.TEACHEROS_CONFIG = {
            supabaseUrl: 'https://nazjyirwvobbwpsevbli.supabase.co',
            supabaseAnonKey: 'sb_publishable_IkS5YJCSjSm9IAk9eXuBVw_kKTUjMZx'
          };
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
