const KEY='teacheros_v4_db';
const SESSION_KEY='teacheros_v4_session';
const BACKUP_VERSION=4;
const CLOUD_CONFIG=window.TEACHEROS_CONFIG||{};
const CLOUD_ENABLED=!!(CLOUD_CONFIG.supabaseUrl&&CLOUD_CONFIG.supabaseAnonKey&&window.supabase);
const cloudClient=CLOUD_ENABLED?window.supabase.createClient(CLOUD_CONFIG.supabaseUrl,CLOUD_CONFIG.supabaseAnonKey):null;
let db=loadDB(), session=localStorage.getItem(SESSION_KEY)==='1', cloudUser=null, cloudBusy=false, cloudSaveTimer=null, cloudLoaded=false;
let currentPage='dashboard', attendanceUndo=[], scanner=null, scanLock=false, usbBuffer='', usbTimer=null;

function nowISO(){return new Date().toISOString()}
function today(){return new Date().toISOString().slice(0,10)}
function timeNow(){return new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function clone(x){return JSON.parse(JSON.stringify(x))}
function uid(prefix='id'){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function activeStudents(){return db.students.filter(s=>s.status==='active')}
function student(id){return db.students.find(s=>String(s.id)===String(id))}
function group(code){return db.groups.find(g=>g.code===code)}
function atFor(id){return db.attendance.filter(a=>String(a.studentId)===String(id))}
function attRecord(studentId,date){return db.attendance.find(a=>String(a.studentId)===String(studentId)&&a.date===date)}
function save(){localStorage.setItem(KEY,JSON.stringify(db)); updateOnlineState(); queueCloudSave()}
function queueCloudSave(){
  if(!CLOUD_ENABLED||!cloudUser||!cloudLoaded)return;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(()=>saveCloud(false),700);
}
async function saveCloud(show=true){
  if(!CLOUD_ENABLED||!cloudUser||cloudBusy)return false;
  cloudBusy=true;
  try{
    const payload={user_id:cloudUser.id,data:db,updated_at:new Date().toISOString()};
    const {error}=await cloudClient.from('teacheros_data').upsert(payload,{onConflict:'user_id'});
    if(error)throw error;
    if(show)toast('☁️ تمت مزامنة البيانات مع السحابة');
    return true;
  }catch(e){console.error(e); if(show)toast('تعذر رفع البيانات للسحابة — النسخة المحلية ما زالت محفوظة'); return false}
  finally{cloudBusy=false}
}
async function loadCloud(){
  if(!CLOUD_ENABLED||!cloudUser)return;
  try{
    const {data,error}=await cloudClient.from('teacheros_data').select('data,updated_at').eq('user_id',cloudUser.id).maybeSingle();
    if(error)throw error;
    if(data&&data.data){db=normalizeDB(data.data);localStorage.setItem(KEY,JSON.stringify(db));cloudLoaded=true;toast('☁️ تم تحميل بياناتك من السحابة');}
    else {cloudLoaded=true;await saveCloud(false);toast('☁️ تم إنشاء نسخة السحابة لأول مرة')}
  }catch(e){console.error(e);toast('تعذر الاتصال بقاعدة البيانات — ستعمل النسخة المحلية');cloudLoaded=true}
}
async function initCloud(){
  if(!CLOUD_ENABLED){cloudLoaded=true;return}
  const {data}=await cloudClient.auth.getSession();
  cloudUser=data.session?.user||null;
  if(cloudUser){session=true;localStorage.setItem(SESSION_KEY,'1');await loadCloud()}
  else {session=false;localStorage.removeItem(SESSION_KEY)}
  cloudClient.auth.onAuthStateChange(async (_event,sess)=>{
    cloudUser=sess?.user||null;
    if(cloudUser){session=true;localStorage.setItem(SESSION_KEY,'1');await loadCloud();render()}
    else {session=false;localStorage.removeItem(SESSION_KEY);cloudLoaded=false;render()}
  });
  render();
}
function loadDB(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const d=JSON.parse(raw); return normalizeDB(d)}
  }catch(e){}
  return normalizeDB(clone(SEED));
}
function normalizeDB(d){
  d.groups=d.groups||[]; d.students=d.students||[]; d.attendance=d.attendance||[];
  d.grades=d.grades||[]; d.exams=d.exams||[]; d.communications=d.communications||[];
  d.settings=Object.assign({teacherName:'المدرس',subject:'',centerName:'',attendanceThreshold:70,lateAfterMinutes:10},d.settings||{});
  d.attendanceSessions=d.attendanceSessions||[];
  d.auditLogs=d.auditLogs||[];
  d.notes=d.notes||[];
  d.documents=d.documents||[];
  d.notifications=d.notifications||[];
  d.students.forEach(s=>{s.internalId=s.internalId||uid('stu');s.barcode=s.barcode||s.code;s.status=s.status||'active'});
  return d;
}
function audit(action,studentId,oldValue,newValue,meta={}){
  db.auditLogs.push({id:uid('audit'),at:nowISO(),action,studentId:studentId||null,oldValue,newValue,meta});
  if(db.auditLogs.length>5000) db.auditLogs=db.auditLogs.slice(-5000);
}

function setAttState(k,v){window.attState=Object.assign(window.attState||{}, {[k]:v}); render()}
function attendanceCard(s,a,date){
  const status=a?.status||'none', labels={present:'حاضر',absent:'غائب',late:'متأخر',excused:'بعذر',early:'مغادرة مبكرة',none:'لم يسجل'};
  const cls={present:'greenB',absent:'redB',late:'amberB',excused:'purpleB',early:'blue',none:'grayB'}[status];
  return `<div class="att attSwipe ${status==='none'?'unrecorded':''}" data-sid="${s.id}" ontouchstart="swipeStart(event)" ontouchend="swipeEnd(event,${s.id},'${date}')">
  <div style="min-width:0"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.name)}</b><span class="muted">${s.code}</span>${a?.time?` · <span class="muted">${a.time}</span>`:''}<br><span class="badge ${cls}"><span class="statusDot sd-${status}"></span>${labels[status]}</span></div>
  <div class="attBtns"><button class="p" onclick="setAttendance(${s.id},'${date}','present','manual')">حاضر</button><button class="a" onclick="setAttendance(${s.id},'${date}','absent','manual')">غائب</button><button class="l" onclick="setAttendance(${s.id},'${date}','late','manual')">متأخر</button><button class="e" onclick="setAttendance(${s.id},'${date}','excused','manual')">بعذر</button></div></div>`;
}
let swipeX=0;
function swipeStart(e){swipeX=e.changedTouches[0].clientX}
function swipeEnd(e,id,date){const dx=e.changedTouches[0].clientX-swipeX;if(Math.abs(dx)<70)return;setAttendance(id,date,dx>0?'present':'absent','manual')}
function pushUndo(prev){attendanceUndo.push(prev);if(attendanceUndo.length>50)attendanceUndo.shift()}
function undoAttendance(){const u=attendanceUndo.pop();if(!u)return toast('لا يوجد إجراء للتراجع عنه');if(u.old){db.attendance=db.attendance.filter(a=>a.id!==u.old.id);db.attendance.push(u.old)}else db.attendance=db.attendance.filter(a=>!(String(a.studentId)===String(u.studentId)&&a.date===u.date));save();audit('undo',u.studentId,u.new,u.old);render();toast('تم التراجع')}
function setAttendance(studentId,date,status,method='manual',extra={}){
  const s=student(studentId); if(!s)return;
  const old=attRecord(studentId,date); pushUndo({studentId,date,old:old?clone(old):null,new:status});
  const time=timeNow(); const rec={id:old?.id||uid('att'),studentId,date,group:s.group,status,time,method,reason:extra.reason||'',minutesLate:extra.minutesLate||0,createdAt:old?.createdAt||nowISO(),updatedAt:nowISO()};
  if(old){Object.assign(old,rec)}else db.attendance.push(rec);
  audit('attendance',studentId,old?clone(old):null,clone(rec),{method}); save();
}

function attendanceSummary(date,g){

  <div class="panel"><h3>وضع USB Barcode Scanner</h3><div class="notice">يمكن استخدام قارئ Barcode USB كأنه Keyboard. اضغط هنا ثم امسح البطاقة.</div><input id="usbScan" style="margin-top:10px;width:100%;padding:12px;border:2px solid #d0d5dd;border-radius:10px" placeholder="جاهز لاستقبال Barcode..." onkeydown="usbKey(event)"><div id="usbStatus" class="muted" style="margin-top:8px"></div>

function openScannerForGroup(){currentPage='scanner';render();setTimeout(()=>{document.getElementById('scannerGroup').value=window.attState?.group||db.groups[0]?.code;startAttendanceScanner()},200)}
function startAttendanceScanner(){
  stopScanner();
  if(typeof Html5Qrcode==='undefined')return toast('مكتبة QR غير متاحة — تحقق من الاتصال أو استخدم USB Barcode');
  const el=document.getElementById('reader'); if(!el)return;
  scanner=new Html5Qrcode('reader');
  scanner.start({facingMode:{exact:'environment'}},{fps:12,qrbox:{width:250,height:250}},txt=>handleScan(txt,'QR')).catch(()=>scanner.start({facingMode:'environment'},{fps:10,qrbox:250},txt=>handleScan(txt,'QR')).catch(()=>toast('تعذر تشغيل الكاميرا — تأكد من إذن الكاميرا')));
}
function stopScanner(){if(scanner){scanner.stop().then(()=>scanner.clear()).catch(()=>{});scanner=null}}
function handleScan(code,method='QR'){
  if(scanLock)return; scanLock=true; setTimeout(()=>scanLock=false,850);
  const s=activeStudents().find(x=>x.code===code||x.barcode===code||x.internalId===code);
  if(!s){toast('⚠️ الكود غير موجود');return}
  const date=document.getElementById('scannerDate')?.value||today();
  const old=attRecord(s.id,date);
  if(old){showScanResult(`⚠️ ${s.name} مسجل بالفعل`,old.status+' · '+old.time);return}
  setAttendance(s.id,date,'present',method);
  const r=document.getElementById('scanResult');if(r)r.innerHTML=`<b class="successText">✓ ${esc(s.name)}</b><br>${s.code} · تم تسجيل الحضور ${timeNow()}`;
  if(navigator.vibrate)navigator.vibrate(80);
  try{new AudioContext().resume()}catch(e){}
}
function showScanResult(a,b){const r=document.getElementById('scanResult');if(r)r.innerHTML=`<b>${esc(a)}</b><br><span class="muted">${esc(b)}</span>`}
function usbKey(e){
  if(e.key==='Enter'){const v=e.target.value.trim();e.target.value='';if(v)handleScan(v,'Barcode');return}
}
document.addEventListener('keydown',e=>{
  if(e.ctrlKey&&e.key.toLowerCase()==='z'){e.preventDefault();if(currentPage==='attendance')undoAttendance();return}
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();quickSearch();return}
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;
  if(currentPage==='attendance'){
    if(e.key.toLowerCase()==='a')setFocused('present');
    if(e.key.toLowerCase()==='x')setFocused('absent');
    if(e.key.toLowerCase()==='l')setFocused('late');
    if(e.key==='Enter')focusNext();
    if(e.key.toLowerCase()==='n')focusNext();
    if(e.key.toLowerCase()==='p')focusPrev();
    if(e.key.toLowerCase()==='s')openScannerForGroup();
  }
});
function focusCards(){return [...document.querySelectorAll('.att[data-sid]')]}
let focusIndex=0;
function setFocused(status){const cards=focusCards();if(!cards.length)return;const id=+cards[focusIndex%cards.length].dataset.sid;const d=window.attState?.date||today();setAttendance(id,d,status,'manual');render();setTimeout(()=>{const c=focusCards()[focusIndex%Math.max(focusCards().length,1)];c?.scrollIntoView({block:'center'})},50)}
function focusNext(){const c=focusCards();if(!c.length)return;focusIndex=Math.min(focusIndex+1,c.length-1);c[focusIndex]?.scrollIntoView({block:'center'})}
function focusPrev(){const c=focusCards();if(!c.length)return;focusIndex=Math.max(focusIndex-1,0);c[focusIndex]?.scrollIntoView({block:'center'})}

function saveStudent(id){

  else{let code=document.getElementById('sfCode').value.trim()||nextCode(g);if(db.students.some(s=>s.code===code))return toast('الكود موجود بالفعل');const s={id:nextId(),internalId:uid('stu'),name,code,group:g,guardian:document.getElementById('sfGuardian').value.trim(),phone:document.getElementById('sfPhone').value.trim(),notes:document.getElementById('sfNotes').value.trim(),status:'active',joined:document.getElementById('sfJoined').value,barcode:code,createdAt:nowISO()};db.students.push(s);audit('student_create',s.id,null,s);save();closeModal();render();toast('تمت إضافة الطالب')}

function followupList(){
  const t=+db.settings.attendanceThreshold||70;
  return activeStudents().map(s=>{const p=attPct(s.id), a=atFor(s.id).filter(x=>x.status==='absent');let streak=0;const days=[...new Set(a.map(x=>x.date))].sort().reverse();for(let i=0;i<days.length;i++){if(i===0||new Date(days[i-1])-new Date(days[i])<=3*86400000)streak++;else break}return {s,p,reason:p!==null&&p<t?`نسبة الحضور أقل من ${t}%`:streak>=2?`${streak} غيابات متتالية`:atFor(s.id).filter(x=>x.status==='late').length>=3?'تأخير متكرر':'',streak}}).filter(x=>x.p!==null&&(x.p<t||x.streak>=2||atFor(x.s.id).filter(a=>a.status==='late').length>=3))
}

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(db.students),'الطلاب');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(db.groups),'المجموعات');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(db.attendance),'الحضور');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(db.grades),'الدرجات');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(db.communications),'التواصل');
  XLSX.writeFile(wb,'TeacherOS_V3_Export.xlsx');toast('تم تصدير Excel')
}
function exportAttendance(date,g){
  if(typeof XLSX==='undefined')return;
  const rows=activeStudents().filter(s=>s.group===g).map(s=>{const a=attRecord(s.id,date);return {الاسم:s.name,الكود:s.code,المجموعة:g,الحالة:a?.status||'غير مسجل',الوقت:a?.time||'',الطريقة:a?.method||'',السبب:a?.reason||''}});
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'حضور');XLSX.writeFile(wb,`Attendance_${g}_${date}.xlsx`)
}
function exportCSV(){
  const rows=activeStudents().map(s=>[s.name,s.code,s.group,s.guardian,s.phone,attPct(s.id)??'',gradeFor(s.id)??'']);
  const csv='الاسم,الكود,المجموعة,ولي الأمر,الهاتف,الحضور,متوسط الدرجات\\n'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='TeacherOS_students.csv';a.click()
}
function backupExport(){
  const payload={version:BACKUP_VERSION,exportedAt:nowISO(),db};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download=`TeacherOS_Backup_${today()}.json`;a.click();toast('تم إنشاء Backup')
}
function backupImport(){
  const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);const d=normalizeDB(x.db||x);if(d.students.length<db.students.length&&!confirm('النسخة الاحتياطية تحتوي عدد طلاب أقل من الحالي. المتابعة؟'))return;db=d;save();render();toast('تم استرجاع النسخة الاحتياطية')}catch(e){toast('ملف Backup غير صالح')}};r.readAsText(f)};i.click()
}
function importExcel(){
  const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls,.csv';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const wb=XLSX.read(r.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws);const preview=rows.slice(0,8).map(x=>({name:x['الاسم']||x['اسم الطالب']||x['Name']||'',code:x['الكود']||x['Code']||'',group:x['المجموعة']||x['Group']||db.groups[0]?.code||'',guardian:x['ولي_الأمر']||x['ولي الأمر']||'',phone:x['الهاتف']||''})).filter(x=>x.name);window.pendingImport=rows;openModal(`<div class="modalHead"><h3>معاينة استيراد Excel</h3><button class="close" onclick="closeModal()">✕</button></div><div class="notice">تم العثور على <b>${rows.length}</b> صف. سيتم منع تكرار الأكواد وعدم حذف البيانات الحالية.</div><div class="tableWrap" style="margin-top:10px"><table><thead><tr><th>الاسم</th><th>الكود</th><th>المجموعة</th><th>الهاتف</th></tr></thead><tbody>${preview.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.code)}</td><td>${esc(x.group)}</td><td>${esc(x.phone)}</td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="btn" onclick="confirmImport()">استيراد بعد التحقق</button><button class="btn gray" onclick="closeModal()">إلغاء</button></div>`)}catch(e){toast('تعذر قراءة الملف')}};r.readAsArrayBuffer(f)};i.click()
}
function confirmImport(){
  const rows=window.pendingImport||[];let added=0,skipped=0;for(const r of rows){const name=String(r['الاسم']||r['اسم الطالب']||r['Name']||'').trim();if(!name){skipped++;continue}const g=String(r['المجموعة']||r['Group']||db.groups[0]?.code||'').trim();let code=String(r['الكود']||r['Code']||'').trim();if(!code)code=nextCode(g);if(db.students.some(s=>s.code===code)){skipped++;continue}db.students.push({id:nextId(),internalId:uid('stu'),name,code,group:g,guardian:String(r['ولي_الأمر']||r['ولي الأمر']||''),phone:String(r['الهاتف']||''),notes:'',status:'active',joined:today(),barcode:code,createdAt:nowISO()});added++}window.pendingImport=null;save();closeModal();render();toast(`تمت إضافة ${added} طالب — تم تخطي ${skipped}`)}
function archivePage(){const list=db.students.filter(s=>s.status!=='active');return layout('الأرشيف','الطلاب غير النشطين',`<div class="panel"><div class="tableWrap"><table><thead><tr><th>الاسم</th><th>الكود</th><th>المجموعة</th><th>الحالة</th><th></th></tr></thead><tbody>${list.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.code}</td><td>${s.group}</td><td>${s.status}</td><td><button class="btn light sm" onclick="reactivate(${s.id})">إعادة تنشيط</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">الأرشيف فارغ</td></tr>'}</tbody></table></div></div>`)}
function reactivate(id){student(id).status='active';save();render();toast('تمت إعادة الطالب')}

function settingsPage(){return layout('الإعدادات','قواعد الحضور والبيانات العامة والنسخ الاحتياطي',`<div class="grid"><div class="panel"><div class="form"><div class="field"><label>اسم المدرس</label><input id="sn" value="${esc(db.settings.teacherName)}"></div><div class="field"><label>المادة</label><input id="ssub" value="${esc(db.settings.subject)}"></div><div class="field"><label>اسم السنتر / المكان</label><input id="sc" value="${esc(db.settings.centerName)}"></div><div class="field"><label>حد المتابعة للحضور %</label><input id="sth" type="number" value="${db.settings.attendanceThreshold}"></div><div class="field"><label>التأخير بعد (دقيقة)</label><input id="slate" type="number" value="${db.settings.lateAfterMinutes}"></div></div><div class="actions"><button class="btn" onclick="saveSettings()">حفظ</button><button class="btn amber" onclick="backupExport()">Backup</button><button class="btn green" onclick="backupImport()">Restore</button><button class="btn red" onclick="logout()">تسجيل الخروج</button></div></div><div class="panel"><h3>اختصارات الحضور</h3><div class="list"><div class="item"><span><span class="kbd">A</span> حاضر</span><span class="muted">سريع</span></div><div class="item"><span><span class="kbd">X</span> غائب</span><span class="muted">سريع</span></div><div class="item"><span><span class="kbd">L</span> متأخر</span><span class="muted">سريع</span></div><div class="item"><span><span class="kbd">Enter</span> التالي</span><span class="muted">تنقل</span></div><div class="item"><span><span class="kbd">Ctrl+Z</span> تراجع</span><span class="muted">آخر إجراء</span></div></div><div class="notice" style="margin-top:10px">النسخة الحالية تعمل محليًا في المتصفح. Offline والحفظ المحلي فعالان؛ المزامنة الحقيقية مع خادم تحتاج Backend/API في مرحلة الإنتاج.</div></div></div>`)}
function saveSettings(){db.settings.teacherName=document.getElementById('sn').value;db.settings.subject=document.getElementById('ssub').value;db.settings.centerName=document.getElementById('sc').value;db.settings.attendanceThreshold=+document.getElementById('sth').value||70;db.settings.lateAfterMinutes=+document.getElementById('slate').value||10;save();toast('تم حفظ الإعدادات')}
function quickSearch(){
  openModal(`<div class="modalHead"><h3>بحث سريع</h3><button class="close" onclick="closeModal()">✕</button></div><input id="globalSearch" autofocus placeholder="اسم / كود / هاتف ولي الأمر..." style="width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px" oninput="globalSearch(this.value)"><div id="globalResults" class="list" style="margin-top:10px"></div>`)
}
function globalSearch(q){const r=activeStudents().filter(s=>(s.name+' '+s.code+' '+s.guardian+' '+s.phone).toLowerCase().includes(q.toLowerCase())).slice(0,12);document.getElementById('globalResults').innerHTML=r.map(s=>`<button class="item" style="width:100%;border:1px solid var(--line);background:#fff;text-align:right" onclick="closeModal();profile(${s.id})"><span><b>${esc(s.name)}</b><br><span class="muted">${s.code} · ${s.group}</span></span><span>${attPct(s.id)??'—'}${attPct(s.id)!==null?'%':''}</span></button>`).join('')||'<div class="empty">لا توجد نتائج</div>'}
function attPct(id){const a=atFor(id);if(!a.length)return null;const eligible=a.filter(x=>['present','absent','late','excused'].includes(x.status));if(!eligible.length)return null;return Math.round(eligible.filter(x=>x.status==='present'||x.status==='late').length/eligible.length*100)}
function printStudentCard(id){
  const s=student(id);openModal(`<div class="modalHead"><h3>كارت الطالب</h3><button class="close" onclick="closeModal()">✕</button></div><div id="singleCard" class="cardsPrint"><div class="cardPrint"><h3>${esc(db.settings.centerName||'TeacherOS')}</h3><b>${esc(s.name)}</b><div>${s.code} · ${s.group}</div><div id="printQR" style="margin:8px auto;width:120px"></div><svg id="printBar"></svg><div class="small">${esc(db.settings.teacherName)}</div></div></div><div class="actions"><button class="btn" onclick="window.print()">طباعة</button></div>`);setTimeout(()=>{new QRCode(document.getElementById('printQR'),{text:s.internalId,width:120,height:120});JsBarcode('#printBar',s.barcode,{format:'CODE128',width:1.4,height:42,displayValue:true,fontSize:9})},50)
}
function printCards(){
  openModal(`<div class="modalHead"><h3>طباعة كروت المجموعة</h3><button class="close" onclick="closeModal()">✕</button></div><div class="toolbar"><select id="pcGroup">${db.groups.map(g=>`<option>${g.code}</option>`).join('')}</select><button class="btn" onclick="renderPrintCards()">عرض الكروت</button></div><div id="cardsArea"></div>`)
}
function renderPrintCards(){
  const g=document.getElementById('pcGroup').value, list=activeStudents().filter(s=>s.group===g);document.getElementById('cardsArea').innerHTML=`<div class="cardsPrint">${list.map(s=>`<div class="cardPrint"><b>${esc(db.settings.centerName||'TeacherOS')}</b><h3>${esc(s.name)}</h3><div>${s.code} · ${s.group}</div><div id="qr_${s.id}" style="margin:6px auto;width:90px"></div><svg id="bar_${s.id}"></svg><div class="small">${esc(db.settings.teacherName)}</div></div>`).join('')}</div><div class="actions"><button class="btn" onclick="window.print()">🖨️ Print All</button></div>`;setTimeout(()=>list.forEach(s=>{new QRCode(document.getElementById('qr_'+s.id),{text:s.internalId,width:90,height:90});JsBarcode('#bar_'+s.id,s.barcode,{format:'CODE128',width:1,height:34,displayValue:true,fontSize:8})}),50)
}

function render(){
  if(!session){loginPage();return}
  updateOnlineState();
  let body='';
  if(currentPage==='dashboard')body=dashboardPage();
  else if(currentPage==='attendance')body=attendancePage();
  else if(currentPage==='scanner')body=scannerPage();
  else if(currentPage==='students')body=studentsPage();
  else if(currentPage==='groups')body=groupsPage();
  else if(currentPage==='grades')body=gradesPage();
  else if(currentPage==='exams')body=examsPage();
  else if(currentPage==='followup')body=followupPage();
  else if(currentPage==='communications')body=communicationsPage();
  else if(currentPage==='reports')body=reportsPage();
  else if(currentPage==='archive')body=archivePage();
  else if(currentPage==='settings')body=settingsPage();
  document.getElementById('root').innerHTML=body;
}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
initCloud();
</script>
</body>
</html>
