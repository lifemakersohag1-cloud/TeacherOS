<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>TeacherOS</title><link rel="manifest" href="manifest.webmanifest"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>body{font-family:Arial,sans-serif;background:#f4f7fb;color:#172033;margin:0}*{box-sizing:border-box}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.btn{border:0;border-radius:9px;padding:9px 12px;background:#2563eb;color:#fff;cursor:pointer}.btn.gray{background:#e5e7eb;color:#111}.btn.red{background:#dc2626}.input,select{width:100%;padding:9px;border:1px solid #ccd1d9;border-radius:9px;margin:4px 0 9px}nav{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none!important}.stat{font-size:26px;font-weight:bold}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:8px;border-bottom:1px solid #eee;text-align:right}.ok{color:#16803c}.bad{color:#c22}.muted{color:#667085;font-size:12px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.pill{padding:5px 9px;border-radius:999px;background:#e8eefc;font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.login{max-width:420px;margin:8vh auto}.toast{position:fixed;bottom:15px;left:15px;background:#111827;color:#fff;padding:10px 14px;border-radius:9px;display:none}.toast.show{display:block}</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script src="config.js"></script><script>
const cfg=window.TEACHEROS_CONFIG||{};const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const KEY='teacheros_compact';let db=loadLocal(),user=null,tab='dashboard',selectedDate=new Date().toISOString().slice(0,10);function loadLocal(){try{return JSON.parse(localStorage.getItem(KEY))||empty()}catch{return empty()}}function empty(){return{groups:[],students:[],attendance:[],settings:{teacherName:'المدرس',subject:'',centerName:''}}}function saveLocal(){localStorage.setItem(KEY,JSON.stringify(db))}function toast(x){let e=document.getElementById('toast');e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function sync(){if(!user)return;const {error}=await sb.from('teacheros_data').upsert({user_id:user.id,data:db,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)toast('تعذر الحفظ السحابي؛ تم الحفظ محليًا')}async function loadCloud(){if(!user)return;try{let {data,error}=await sb.from('teacheros_data').select('data').eq('user_id',user.id).maybeSingle();if(error)throw error;if(data?.data){db=data.data;saveLocal()}else await sync()}catch(e){toast('وضع Offline: البيانات المحلية تعمل')}}function mutate(fn){fn();saveLocal();sync();render()}function att(sid){return db.attendance.find(x=>String(x.studentId)===String(sid)&&x.date===selectedDate)}function setAtt(sid,status){mutate(()=>{let a=att(sid);if(!a){a={studentId:sid,date:selectedDate};db.attendance.push(a)}a.status=status;a.at=new Date().toISOString()})}function active(){return db.students.filter(s=>s.status!=='inactive')}function login(){document.getElementById('app').innerHTML='<div class="login card"><h1>📚 TeacherOS</h1><p class="muted">نظام المدرس أونلاين + Offline</p><input id="em" class="input" type="email" placeholder="البريد الإلكتروني"><input id="pw" class="input" type="password" placeholder="كلمة المرور"><div class="actions"><button class="btn" onclick="doLogin()">دخول</button><button class="btn gray" onclick="signup()">إنشاء حساب</button></div><p class="muted">الحساب السحابي يحفظ بياناتك على Supabase ويمكن فتحها من أي جهاز.</p></div>'}async function doLogin(){let email=em.value.trim(),password=pw.value;let r=await sb.auth.signInWithPassword({email,password});if(r.error)toast(r.error.message);else{user=r.data.user;await loadCloud();render()}}async function signup(){let email=em.value.trim(),password=pw.value;if(password.length<6)return toast('كلمة المرور 6 أحرف على الأقل');let r=await sb.auth.signUp({email,password});if(r.error)toast(r.error.message);else toast('تم إنشاء الحساب. راجع البريد إن طُلب ثم سجّل الدخول.')}async function logout(){await sb.auth.signOut();user=null;render()}function shell(body){return '<div class="wrap"><div class="top"><div><h1>📚 TeacherOS</h1><span class="pill">'+esc(user?.email||'')+'</span></div><div class="actions"><button class="btn" onclick="tab=\'dashboard\';render()">الرئيسية</button><button class="btn" onclick="tab=\'attendance\';render()">الحضور</button><button class="btn" onclick="tab=\'students\';render()">الطلاب</button><button class="btn" onclick="tab=\'groups\';render()">المجموعات</button><button class="btn" onclick="tab=\'import\';render()">استيراد Excel</button><button class="btn gray" onclick="sync();toast(\'تمت المزامنة\')">☁️ مزامنة</button><button class="btn red" onclick="logout()">خروج</button></div></div>'+body+'</div>'}function dashboard(){let a=db.attendance.filter(x=>x.date===selectedDate),p=a.filter(x=>x.status==='present'||x.status==='late').length,ab=a.filter(x=>x.status==='absent').length;return shell('<div class="grid"><div class="card"><div class="muted">الطلاب</div><div class="stat">'+active().length+'</div></div><div class="card"><div class="muted">المجموعات</div><div class="stat">'+db.groups.length+'</div></div><div class="card"><div class="muted">حاضر اليوم</div><div class="stat ok">'+p+'</div></div><div class="card"><div class="muted">غائب اليوم</div><div class="stat bad">'+ab+'</div></div></div><div class="card"><h3>استيراد البيانات</h3><p>لو هذه أول مرة، استخدم استيراد Excel لإضافة الطلاب والمجموعات من ملفك.</p><button class="btn" onclick="tab=\'import\';render()">اختيار ملف Excel</button></div>')}function attendance(){let list=active();return shell('<div class="card"><div class="top"><div><h2>الحضور</h2><span class="muted">التاريخ</span></div><input id="date" class="input" style="max-width:190px" type="date" value="'+selectedDate+'" onchange="selectedDate=this.value;render()"><button class="btn" onclick="list.forEach(s=>setAtt(s.id,\'present\'))">الكل حاضر</button></div><div class="table"><table><thead><tr><th>الطالب</th><th>المجموعة</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>'+list.map(s=>{let a=att(s.id);return '<tr><td>'+esc(s.name)+'</td><td>'+esc(s.group||'')+'</td><td>'+esc(a?.status||'لم يسجل')+'</td><td class="actions"><button class="btn" onclick="setAtt(\''+s.id+'\',\'present\')">حاضر</button><button class="btn red" onclick="setAtt(\''+s.id+'\',\'absent\')">غائب</button><button class="btn gray" onclick="setAtt(\''+s.id+'\',\'late\')">متأخر</button></td></tr>'}).join('')+'</tbody></table></div></div>')}function students(){return shell('<div class="card"><div class="top"><h2>الطلاب</h2><button class="btn" onclick="addStudent()">+ طالب</button></div><input id="q" class="input" placeholder="بحث بالاسم أو الكود" oninput="renderStudents(this.value)"><div id="studentRows"></div></div>')}function renderStudents(q=''){let r=active().filter(s=>(s.name+' '+s.code).toLowerCase().includes(q.toLowerCase()));document.getElementById('studentRows').innerHTML='<div class="table"><table><thead><tr><th>الاسم</th><th>الكود</th><th>المجموعة</th><th>الهاتف</th><th></th></tr></thead><tbody>'+r.map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+esc(s.code)+'</td><td>'+esc(s.group)+'</td><td>'+esc(s.phone)+'</td><td><button class="btn gray" onclick="editStudent(\''+s.id+'\')">تعديل</button> <button class="btn red" onclick="removeStudent(\''+s.id+'\')">حذف</button></td></tr>').join('')+'</tbody></table></div>'}function addStudent(){let n=prompt('اسم الطالب');if(!n)return;let code=prompt('الكود');let group=prompt('المجموعة مثل G1');mutate(()=>db.students.push({id:'s_'+Date.now(),name:n,code:code||'',group:group||'',phone:'',status:'active'}))}function editStudent(id){let s=db.students.find(x=>String(x.id)===String(id));if(!s)return;let n=prompt('الاسم',s.name);if(n===null)return;let code=prompt('الكود',s.code);let group=prompt('المجموعة',s.group);let phone=prompt('الهاتف',s.phone||'');mutate(()=>{s.name=n;s.code=code||'';s.group=group||'';s.phone=phone||''})}function removeStudent(id){if(confirm('حذف الطالب؟'))mutate(()=>{let s=db.students.find(x=>String(x.id)===String(id));if(s)s.status='inactive'})}function groups(){let counts={};active().forEach(s=>counts[s.group]=(counts[s.group]||0)+1);return shell('<div class="card"><div class="top"><h2>المجموعات</h2><button class="btn" onclick="let g=prompt(\'كود المجموعة\');if(g)mutate(()=>db.groups.push({code:g,name:g}))">+ مجموعة</button></div><div class="grid">'+db.groups.map(g=>'<div class="card"><b>'+esc(g.code)+'</b><div>'+esc(g.name||'')+'</div><div class="muted">'+(counts[g.code]||0)+' طالب</div></div>').join('')+'</div></div>')}function importPage(){return shell('<div class="card"><h2>استيراد Excel / CSV</h2><p>الأعمدة المقبولة: الاسم أو name، الكود أو code، المجموعة أو group، الهاتف أو phone، ولي الأمر أو guardian.</p><input id="file" class="input" type="file" accept=".xlsx,.xls,.csv" onchange="importFile(this.files[0])"><div class="muted">سيتم الدمج مع البيانات الحالية وحفظها محليًا وسحابيًا.</div></div>')}async function importFile(file){if(!file)return;let data=await file.arrayBuffer(),wb=XLSX.read(data,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{defval:''});if(!rows.length)return toast('الملف فارغ');mutate(()=>{rows.forEach((r,i)=>{let norm={};Object.keys(r).forEach(k=>norm[k.trim().toLowerCase()]=r[k]);let name=norm['الاسم']||norm['name']||norm['student name']||norm['اسم الطالب'];if(!name)return;let code=norm['الكود']||norm['code']||('IMP-'+(i+1));let group=norm['المجموعة']||norm['group']||'';let phone=norm['الهاتف']||norm['phone']||'';let guardian=norm['ولي الأمر']||norm['guardian']||'';let old=db.students.find(s=>String(s.code)===String(code));if(old){old.name=String(name);old.group=String(group);old.phone=String(phone);old.guardian=String(guardian);old.status='active'}else db.students.push({id:'imp_'+Date.now()+'_'+i,name:String(name),code:String(code),group:String(group),phone:String(phone),guardian:String(guardian),status:'active'});if(group&&!db.groups.some(g=>g.code===String(group)))db.groups.push({code:String(group),name:String(group)})})});toast('تم الاستيراد')}
function render(){if(!user)return login();let b=tab==='dashboard'?dashboard():tab==='attendance'?attendance():tab==='students'?students():tab==='groups'?groups():importPage();document.getElementById('app').innerHTML=b;if(tab==='students')renderStudents()}sb.auth.getSession().then(async r=>{user=r.data.session?.user||null;if(user)await loadCloud();render()});sb.auth.onAuthStateChange(async(_,s)=>{user=s?.user||null;if(user){await loadCloud();render()}else render()});window.addEventListener('online',()=>toast('🟢 عاد الاتصال'));window.addEventListener('offline',()=>toast('🟠 Offline — سيستمر الحفظ محليًا'));
</script></body></html>
